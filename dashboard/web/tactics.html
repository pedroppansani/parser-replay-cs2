<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prancheta tática</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
  /* Mesmos tokens da página da partida (dashboard/web/template.html). */
  :root {
    --paper: #eef1f5; --card: #ffffff; --ink: #0f1620; --ink-2: #4c5a6b; --dim: #7d8a99;
    --line: #dde3eb; --line-2: #eaeef3;
    --ct: #2a78d6; --t: #eb6834; --aqua: #1baf7a; --alerta: #9a5b00;
    --display: "Bricolage Grotesque", Georgia, sans-serif;
    --body: "Figtree", system-ui, -apple-system, sans-serif;
    --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --r: 10px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 14px; }
  header { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 12px 16px;
           background: var(--card); border-bottom: 1px solid var(--line); }
  header h1 { font-family: var(--display); font-size: 20px; margin: 0; }
  header nav { display: flex; flex-wrap: wrap; gap: 6px; }
  header nav a { color: var(--ink-2); text-decoration: none; padding: 3px 8px; border-radius: 6px; }
  header nav a[aria-current] { background: var(--ink); color: #fff; }
  .grade { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; padding: 16px; }
  @media (max-width: 900px) { .grade { grid-template-columns: minmax(0, 1fr); } }
  .palco { background: #161d26; border-radius: var(--r); padding: 8px; display: flex; justify-content: center; }
  #pr-mapa { display: block; border-radius: 6px; touch-action: none; max-width: 100%; }
  aside { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .caixa { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
  .caixa h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 0 0 8px; }
  .linha { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  input[type=text], select { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px;
                             min-width: 0; flex: 1; background: #fff; color: var(--ink); }
  .pr-b, [data-ferramenta], [data-arma], .pr-passo {
    font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink-2);
    border-radius: 6px; padding: 5px 9px; cursor: pointer; }
  .ativo { background: var(--ink) !important; color: #fff !important; border-color: var(--ink) !important; }
  .pr-passo { min-width: 32px; font-weight: 600; }
  #pr-banco { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .pr-ficha { height: 32px; border-radius: 50%; display: grid; place-items: center; color: #fff;
              font-weight: 600; cursor: grab; user-select: none; touch-action: none; aspect-ratio: 1; }
  .pr-ficha.ct { background: var(--ct); } .pr-ficha.t { background: var(--t); }
  .pr-ficha.arrastando { cursor: grabbing; outline: 2px solid var(--ink); }
  .pr-dica, .pr-meta { color: var(--ink-2); margin: 4px 0; }
  .pr-alerta { color: var(--alerta); margin: 6px 0; }
  .pr-cmd { display: flex; gap: 6px; align-items: flex-start; margin: 8px 0; }
  .pr-cmd code { font-family: var(--mono); font-size: 12px; background: var(--paper); padding: 6px 8px;
                 border-radius: 6px; flex: 1; overflow-wrap: anywhere; }
  .pr-lista { margin: 6px 0 0; padding-left: 20px; max-height: 320px; overflow: auto; }
  .pr-lista li { padding: 4px 0; cursor: pointer; border-bottom: 1px solid var(--line-2); }
  .pr-lista li:hover { background: var(--paper); }
  #pr-aviso { color: var(--alerta); margin: 0; }
  #pr-historico { color: var(--dim); font-size: 12px; }
  h3 { margin: 0 0 4px; font-size: 15px; }
</style>
</head>
<body>
<header>
  <h1>Prancheta tática</h1>
  <nav id="pr-mapas"></nav>
</header>
<div class="grade">
  <div class="palco"><canvas id="pr-mapa" aria-label="Mapa da prancheta"></canvas></div>
  <aside>
    <section class="caixa">
      <h2>Tática</h2>
      <div class="linha"><select id="pr-taticas" aria-label="Táticas deste mapa"></select>
        <button class="pr-b" id="pr-nova">Nova</button></div>
      <div class="linha" style="margin-top:6px"><input type="text" id="pr-titulo" aria-label="Título da tática"></div>
      <div class="linha" style="margin-top:6px">
        <button class="pr-b" id="pr-exporta">Exportar</button>
        <button class="pr-b" id="pr-importa">Importar</button>
        <button class="pr-b" id="pr-apaga">Apagar</button>
        <input type="file" id="pr-arquivo" accept=".json,application/json" hidden>
      </div>
      <div class="linha" style="margin-top:6px"><label for="pr-autor">Autor</label>
        <input type="text" id="pr-autor" placeholder="seu nome"></div>
      <p id="pr-historico"></p>
      <p id="pr-aviso" hidden></p>
    </section>
    <section class="caixa">
      <h2>Passos</h2>
      <div class="linha" id="pr-passos"></div>
      <div class="linha" style="margin-top:6px"><input type="text" id="pr-passo-titulo" aria-label="Título do passo" placeholder="o que acontece neste passo">
        <button class="pr-b" id="pr-remove-passo">Remover</button></div>
    </section>
    <section class="caixa">
      <h2>Peças</h2>
      <div id="pr-banco"></div>
    </section>
    <section class="caixa">
      <h2>Granadas</h2>
      <div class="linha">
        <button data-arma="smoke">Smoke</button><button data-arma="flash">Flash</button>
        <button data-arma="he">HE</button><button data-arma="molotov">Molotov</button>
      </div>
      <div class="linha" style="margin-top:6px">
        <button data-ferramenta="mover">Mover</button>
        <button data-ferramenta="buscar">Buscar arremesso</button>
        <button data-ferramenta="granada">Desenhar à mão</button>
      </div>
      <div class="linha" style="margin-top:6px"><label for="pr-raio">Raio da busca</label>
        <input type="range" id="pr-raio" min="50" max="600" step="25"><span id="pr-raio-valor"></span></div>
      <div class="linha" style="margin-top:6px"><label><input type="checkbox" id="pr-so-parado"> só arremessos parados (o comando reproduz sozinho)</label></div>
      <div id="pr-resultados"></div>
    </section>
    <section class="caixa"><h2>Selecionado</h2><div id="pr-selecao"></div></section>
  </aside>
</div>
<script>
/*__MAP_CORE__*/
</script>
<script>
/*__TACTICS_JS__*/
</script>
<script>
(function () {
  var cfg = {
    mapa: /*__MAPA__*/null,
    radar: /*__RADAR__*/null,
    biblioteca: /*__LINEUPS__*/null,
    mapas: /*__MAPAS__*/[]
  };
  var nav = document.getElementById("pr-mapas");
  cfg.mapas.forEach(function (m) {
    var a = document.createElement("a");
    a.href = m.arquivo; a.textContent = m.nome;
    if (m.mapa === cfg.mapa) a.setAttribute("aria-current", "page");
    nav.appendChild(a);
  });
  Prancheta.init(cfg);
})();
</script>
</body>
</html>
