<body>
<!-- topo do site (marca e quatro links): volta para a landing e para a lista de partidas (auditoria 5.3) -->
<!--__TOPO__-->
<div class="pr-cab">
  <h1><span class="pr-rot">Prancheta ·</span> <label class="sr" for="pr-mapa-sel">Mapa</label><select id="pr-mapa-sel"></select></h1>
  <p class="pr-aviso-mapa" id="pr-aviso-mapa" role="note" hidden></p>
  <p class="pr-aviso-celular" id="pr-aviso-celular" role="note"></p>
</div>
<div class="grade">
  <div class="palco" id="pr-palco">
    <div class="pr-barra" id="pr-barra"></div>
    <div class="pr-tela" id="pr-tela"><canvas id="pr-mapa" role="img" aria-label="Mapa da prancheta"></canvas></div>
  </div>
  <aside></aside>
</div>
<script>
/*__MAP_CORE__*/
</script>
<script>
/*__TACTICS_JS__*/
</script>
<script>
(function () {
  var cfg = {
    mapa: /*__MAPA__*/null,
    radar: /*__RADAR__*/null,
    biblioteca: /*__LINEUPS__*/null,
    mapas: /*__MAPAS__*/[],
    modelo3: /*__MODELO3__*/null,
    lugares: /*__LUGARES__*/null
  };
  // o mapa num select com dois grupos: com partidas no corpus e sem (§14); trocar abre a página do mapa
  var sel = document.getElementById("pr-mapa-sel");
  [[true, "Com partidas no corpus"], [false, "Sem partidas no corpus"]].forEach(function (g) {
    var lista = cfg.mapas.filter(function (m) { return !!m.corpus === g[0]; });
    if (!lista.length) return;
    var og = document.createElement("optgroup");
    og.label = g[1];
    lista.forEach(function (m) {
      var o = document.createElement("option");
      o.value = m.arquivo;
      o.textContent = m.nome + (m.corpus ? "" : " (sem partidas)");
      if (m.mapa === cfg.mapa) o.selected = true;
      og.appendChild(o);
    });
    sel.appendChild(og);
  });
  sel.addEventListener("change", function () { window.location.href = sel.value; });
  // aviso do celular (§14): o que dá para fazer na tela pequena; o CSS só o mostra em <= 640 px
  document.getElementById("pr-aviso-celular").textContent = "No celular: ver, tocar e mover jogadores, e granada pela " +
    "aba Granadas. Desenho à mão e andares só no computador.";
  Prancheta.init(cfg);
})();
</script>
</body>
</html>
