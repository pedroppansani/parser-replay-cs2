<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!--__TITULO__--></title>
<!--__META__-->
<!--__FONTES__-->
<style>
  /* Os tokens (cores, fontes, espaços) vêm de dashboard/web/tokens.css, injetado no build. */
  /*__TOKENS__*/
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fundo); color: var(--tinta); font-family: var(--f-texto); -webkit-font-smoothing: antialiased; }
  .shell { max-width: 1180px; margin: 0 auto; padding: 0 20px 64px; }
  header { padding: 28px 0 8px; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: baseline; }
  header nav a { color: var(--tinta-2); text-decoration: none; margin-right: 12px; }
  h1 { font-family: var(--f-cond); font-stretch: var(--larg-condensada); font-size: clamp(28px, 4.5vw, 44px); margin: 6px 0 4px; letter-spacing: -0.02em; }
  .aviso { background: var(--superficie); border: 1px solid var(--linha); border-left: 4px solid var(--decisivo); border-radius: var(--r-md); padding: 12px 16px; margin: 10px 0 18px; color: var(--tinta-2); }
  .grade { display: grid; grid-template-columns: 300px 1fr; gap: 18px; align-items: start; }
  @media (max-width: 860px) { .grade { grid-template-columns: 1fr; } }
  .card { background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--r-md); padding: 14px 16px; }
  .lista { max-height: 70vh; overflow: auto; padding: 6px; }
  .lista label { display: flex; gap: 8px; align-items: baseline; padding: 6px 8px; border-radius: var(--r-md); cursor: pointer; }
  .lista label:hover { background: var(--superficie-2); }
  .lista small { color: var(--apagado); font-family: var(--f-texto); font-size: 10.5px; display: block; }
  input[type=search], select { width: 100%; font: inherit; padding: 7px 9px; border: 1px solid var(--borda); border-radius: var(--r-sm); background: var(--fundo); color: var(--tinta); }
  .filtros { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
  .filtros label { font-family: var(--f-cond); font-stretch: var(--larg-condensada); font-size: 11px; color: var(--apagado); display: grid; gap: 4px; min-width: 150px; font-weight: 600; }
  .legenda { display: flex; flex-wrap: wrap; gap: 14px; margin: 6px 0 12px; font-size: 13px; }
  .legenda i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .grupo h3 { font-family: var(--f-cond); font-stretch: var(--larg-condensada); font-size: 17px; margin: 18px 0 6px; }
  .metrica { display: grid; grid-template-columns: 210px 1fr; gap: 12px; padding: 8px 0; border-top: 1px solid var(--linha); }
  .metrica .nome { font-size: 13px; }
  .metrica .nome small { display: block; color: var(--apagado); font-family: var(--f-texto); font-size: 10.5px; }
  .barras { display: grid; gap: 5px; position: relative; }
  .barra { position: relative; height: 18px; margin-right: 64px; }
  .barra .faixa { position: absolute; top: 3px; height: 12px; border-radius: 3px; opacity: .85; }
  .barra .ic { position: absolute; top: 8px; height: 2px; background: var(--tinta); }
  .barra .bruto { position: absolute; top: 2px; width: 2px; height: 14px; background: var(--tinta); }
  .barra .val { position: absolute; top: 1px; right: -62px; width: 56px; text-align: right; font-family: var(--f-num); font-size: 11px; color: var(--tinta); white-space: nowrap; }
  .media { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--apagado); }
  .nota { color: var(--apagado); font-size: 12.5px; margin-top: 8px; }
  :where(button, a[href], select, input, textarea, summary, [tabindex]):focus-visible { outline: 2px solid var(--foco); outline-offset: 2px; }
</style>
</head>
<body>
<div class="shell">
  <header>
    <nav aria-label="Voltar ao site"><a href="index.html" id="volta-inicio"></a><a href="index.html#partidas" id="volta-partidas"></a></nav>
  </header>
  <h1 id="titulo"></h1>
  <p class="aviso" id="aviso"></p>
  <div class="grade">
    <aside class="card">
      <input type="search" id="busca" aria-label="Buscar jogador">
      <p class="nota" id="ajuda-selecao"></p>
      <div class="lista" id="lista" role="group"></div>
    </aside>
    <main class="card">
      <div class="filtros">
        <label><span id="rot-mapa"></span><select id="mapa"></select></label>
        <label><span id="rot-lado"></span><select id="lado"></select></label>
        <label><span id="rot-media"></span><select id="media"></select></label>
      </div>
      <div class="legenda" id="legenda"></div>
      <div id="graficos"></div>
      <p class="nota" id="como-ler"></p>
    </main>
  </div>
</div>
<script>
/*__MAP_CORE__*/
</script>
<script>
(function () {
  var D = /*__DADOS__*/null;
  var T = /*__TEXTOS__*/null;
  var esc = MapCore.esc;
  if (!D || !T) return;
  // as três cores da paleta validada (decisão 10); a média da função em cinza
  var CORES = ["ct", "tr", "decisivo"].map(function (n) { return getComputedStyle(document.documentElement).getPropertyValue("--" + n).trim(); });
  var MAX_SELECIONADOS = CORES.length;

  function txt(id, s) { var e = document.getElementById(id); if (e) e.textContent = s; }
  document.title = T.titulo;
  txt("titulo", T.titulo); txt("aviso", T.aviso); txt("volta-inicio", T.volta_inicio);
  txt("volta-partidas", T.volta_partidas); txt("ajuda-selecao", T.ajuda_selecao);
  txt("rot-mapa", T.rotulo_mapa); txt("rot-lado", T.rotulo_lado); txt("rot-media", T.rotulo_media);
  txt("como-ler", T.como_ler);
  document.getElementById("busca").placeholder = T.busca;

  var selMapa = document.getElementById("mapa"), selLado = document.getElementById("lado"),
      selMedia = document.getElementById("media");
  selMapa.innerHTML = "<option value=''>" + esc(T.todos_os_mapas) + "</option>" +
    D.mapas.map(function (m, i) { return "<option value='" + i + "'>" + esc(T.nomes_dos_mapas[m] || m) + "</option>"; }).join("");
  selLado.innerHTML = T.lados.map(function (l) { return "<option value='" + esc(l[0]) + "'>" + esc(l[1]) + "</option>"; }).join("");
  selMedia.innerHTML = T.opcoes_media.map(function (l) { return "<option value='" + esc(l[0]) + "'>" + esc(l[1]) + "</option>"; }).join("");

  // os dois (ou três) com mais partidas abrem selecionados
  var porPartidas = D.jogadores.map(function (j, i) { return i; })
    .sort(function (a, b) { return D.jogadores[b].partidas - D.jogadores[a].partidas || a - b; });
  var selecionados = porPartidas.slice(0, 2);

  function lista() {
    var q = document.getElementById("busca").value.toLowerCase();
    document.getElementById("lista").innerHTML = D.jogadores.map(function (j, i) {
      if (q && j.nome.toLowerCase().indexOf(q) < 0) return "";
      var marcado = selecionados.indexOf(i) >= 0;
      return "<label><input type='checkbox' data-i='" + i + "'" + (marcado ? " checked" : "") + "><span>" +
        esc(j.nome) + "<small>" + esc(j.funcao) + " · " + j.partidas + " " + esc(j.partidas === 1 ? T.partida : T.partidas) +
        " · " + j.rounds + " rounds</small></span></label>";
    }).join("");
  }
  document.getElementById("lista").addEventListener("change", function (e) {
    var i = Number(e.target.dataset.i);
    if (e.target.checked) {
      if (selecionados.length >= MAX_SELECIONADOS) selecionados.shift();
      selecionados.push(i);
    } else {
      selecionados = selecionados.filter(function (x) { return x !== i; });
    }
    lista(); desenha();
  });
  document.getElementById("busca").addEventListener("input", lista);
  [selMapa, selLado, selMedia].forEach(function (s) { s.addEventListener("change", desenha); });

  // gerador com semente (mulberry32): o mesmo recorte dá o mesmo intervalo
  function gerador(semente) {
    var a = semente >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0; var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function chaveDoLado(m) {
    var lado = selLado.value;
    if (!lado) return m.chave;
    return m.lado ? m.chave + "_" + lado : null;
  }
  function linhasDe(i) {
    var mapa = selMapa.value;
    return D.linhas.filter(function (r) { return r[0] === i && (mapa === "" || r[1] === Number(mapa)); });
  }
  function soma(linhas, col) {
    var n = 0, d = 0, m = 0;
    linhas.forEach(function (r) { var nd = r[4 + col]; if (nd[1] > 0 && nd[0] != null) { n += nd[0]; d += nd[1]; m += 1; } });
    return { v: d > 0 ? n / d : null, partidas: m };
  }
  function intervalo(linhas, col, semente) {
    var validas = linhas.filter(function (r) { return r[4 + col][1] > 0 && r[4 + col][0] != null; });
    if (validas.length < 2) return null;
    var rnd = gerador(semente), vs = [];
    for (var b = 0; b < D.n_bootstrap; b++) {
      var n = 0, d = 0;
      for (var k = 0; k < validas.length; k++) {
        var r = validas[Math.floor(rnd() * validas.length)][4 + col]; n += r[0]; d += r[1];
      }
      vs.push(n / d);
    }
    vs.sort(function (a, b) { return a - b; });
    return [vs[Math.floor(0.025 * vs.length)], vs[Math.ceil(0.975 * vs.length) - 1]];
  }
  function mediaDaFuncao(funcao, col) {
    var mapa = selMapa.value, n = 0, d = 0;
    D.linhas.forEach(function (r) {
      if (D.jogadores[r[0]].funcao !== funcao && funcao !== null) return;
      if (mapa !== "" && r[1] !== Number(mapa)) return;
      var nd = r[4 + col]; if (nd[1] > 0 && nd[0] != null) { n += nd[0]; d += nd[1]; }
    });
    return d > 0 ? n / d : null;
  }
  function fmt(v, formato) {
    if (v == null) return "—";
    if (formato === "pct") return Math.round(v * 100) + "%";
    return v.toFixed(formato === "num2" ? 2 : 1).replace(".", ",");
  }

  function legenda() {
    document.getElementById("legenda").innerHTML = selecionados.map(function (i, c) {
      var j = D.jogadores[i];
      return "<span><i style='background:" + CORES[c] + "'></i>" + esc(j.nome) + " <small>(" + esc(j.funcao) + ")</small></span>";
    }).join("") + "<span><i style='background:var(--dim)'></i>" + esc(T.legenda_media) + "</span>";
  }

  function desenha() {
    legenda();
    var host = document.getElementById("graficos"), html = "", grupoAtual = null;
    D.metricas.forEach(function (m, mi) {
      var chave = chaveDoLado(m);
      if (chave === null) return;                      // métrica sem recorte por lado
      var col = D.chaves.indexOf(chave);
      if (col < 0) return;
      var k = D.k[chave];
      var dados = selecionados.map(function (i, c) {
        var ls = linhasDe(i), s = soma(ls, col);
        var mediaF = mediaDaFuncao(selMedia.value === "funcao" ? D.jogadores[i].funcao : null, col);
        var enc = s.v == null || mediaF == null ? null
          : (k == null ? mediaF : (s.partidas / (s.partidas + k)) * s.v + (k / (s.partidas + k)) * mediaF);
        return { c: c, bruto: s.v, enc: enc, ic: intervalo(ls, col, D.semente + 7919 * i + mi), media: mediaF,
                 peso: k == null ? 0 : s.partidas / (s.partidas + k), partidas: s.partidas };
      });
      var teto = 0;
      dados.forEach(function (x) { [x.bruto, x.enc, x.media, x.ic ? x.ic[1] : null].forEach(function (v) { if (v != null && v > teto) teto = v; }); });
      teto = teto > 0 ? teto * 1.15 : 1;
      if (m.grupo !== grupoAtual) { if (grupoAtual !== null) html += "</div>"; html += "<div class='grupo'><h3>" + esc(m.grupo) + "</h3>"; grupoAtual = m.grupo; }
      var nota = k == null ? T.sem_separacao : T.peso_do_jogador;
      html += "<div class='metrica' data-chave='" + esc(chave) + "'><div class='nome'>" + esc(m.rotulo) +
        "<small>" + esc(nota) + "</small></div><div class='barras'>" +
        dados.map(function (x) {
          var pos = function (v) { return Math.max(0, Math.min(100, v / teto * 100)); };
          if (x.enc == null) return "<div class='barra'><span class='val'>—</span></div>";
          var titulo = T.titulo_barra.replace("{bruto}", fmt(x.bruto, m.formato)).replace("{encolhido}", fmt(x.enc, m.formato))
            .replace("{partidas}", x.partidas).replace("{peso}", Math.round(x.peso * 100) + "%")
            .replace("{media}", fmt(x.media, m.formato));
          return "<div class='barra' title='" + esc(titulo) + "'>" +
            "<span class='faixa' style='left:0;width:" + pos(x.enc) + "%;background:" + CORES[x.c] + "'></span>" +
            (x.ic ? "<span class='ic' style='left:" + pos(x.ic[0]) + "%;width:" + Math.max(0.5, pos(x.ic[1]) - pos(x.ic[0])) + "%'></span>" : "") +
            "<span class='bruto' style='left:" + pos(x.bruto) + "%'></span>" +
            (x.media != null ? "<span class='media' style='left:" + pos(x.media) + "%'></span>" : "") +
            "<span class='val'>" + esc(fmt(x.enc, m.formato)) + "</span>" +
            "</div>";
        }).join("") + "</div></div>";
    });
    if (grupoAtual !== null) html += "</div>";
    host.innerHTML = selecionados.length ? html : "<p class='nota'>" + esc(T.nada_selecionado) + "</p>";
  }

  window.Jogadores = { _interno: { D: D, soma: soma, intervalo: intervalo, mediaDaFuncao: mediaDaFuncao,
                                   selecionados: function () { return selecionados.slice(); } } };
  lista(); desenha();
})();
</script>
</body>
</html>
