# Publica o site no GitHub Pages SEM guardar o HTML no repositório.
#
# O site é saída gerada: o que se versiona é o que o gera (código + data/processed/).
# Aqui ele é reconstruído do zero a cada push e vai para o Pages como artefato,
# que não entra no histórico do git -- quem clona o repositório não baixa HTML.
#
# Os TESTES rodam antes: o site só é gerado e publicado com a suíte verde. O
# workflow roda em toda branch (para a branch de trabalho ter CI antes do
# merge); a publicação acontece só no main. As actions ficam fixadas por SHA,
# conferido no repositório oficial de cada uma (Node 24).
name: Testa e publica o site

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Limites (ci-optimizer, escolha do Pedro): um passo travado para no limite em vez de rodar as 6 horas do padrão.
  # Medido nas 15 últimas execuções verdes: testes ~9 min (máx. 9,4), build ~1,2 min (máx. 1,5), deploy ~0,4 min (máx. 0,8).
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependências (versões fixadas)
        run: pip install -r requirements-dev.txt
      # Os testes de navegador usam o Chromium do Playwright (no runner não há
      # Chrome instalado no canal que eles pedem primeiro; caem no Chromium).
      - name: Chromium do Playwright
        run: python -m playwright install --with-deps chromium
      # Os testes que dependem de data/interim/ (não versionado) são pulados
      # num clone limpo -- nunca quebram.
      - name: Testes
        run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"   # o awpy 2.0.2 não suporta 3.14 (CLAUDE.md, Ambiente)
          cache: pip
      - name: Dependências (versões fixadas)
        run: pip install -r requirements.txt
      # Grupos na prancheta (fase 13): a URL do projeto e a chave PÚBLICA do Supabase vêm das variáveis do
      # repositório (Settings > Secrets and variables > Actions > Variables). São públicas por desenho (o RLS
      # protege), mas ficam fora do código. Sem elas, ou com GRUPOS_ATIVOS = False, o botão não aparece.
      - name: Gera o site a partir de data/processed/
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: python -m scripts.build_site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
